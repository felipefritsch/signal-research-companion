[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-research-companion"
version = "0.1.0"
description = "An offline-first teaching lab for decisions, agent harnesses and quant research validity"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2,<4", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
notebooks = ["nbformat>=5,<6", "nbclient>=0.10,<1", "nbconvert>=7,<8", "ipykernel>=6,<8"]
sources = ["beautifulsoup4>=4.12,<5", "pypdf>=6,<7"]

[tool.setuptools.packages.find]
include = ["signal_lab*"]
